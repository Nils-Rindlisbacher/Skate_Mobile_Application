name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Erlaubt den manuellen Start über die GitHub-Webseite

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: Application/Skaterz

      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
        working-directory: Application/Skaterz

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Application/Skaterz/build/web
          branch: gh-pages
          clean: true
